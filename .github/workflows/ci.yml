name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      # The engine eval runs end to end, and the committed report is what it writes now.
      - run: npm run eval:engine && git diff --exit-code -- eval/engine-report.json eval/engine-report.md
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          RETELL_API_KEY: build-dummy
          ANTHROPIC_API_KEY: build-dummy
          APP_URL: http://localhost:3000
          JUDGE_PROVIDER: claude
