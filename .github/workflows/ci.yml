name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      # The engine eval runs end to end, and the committed report is what it writes now.
      - run: npm run eval:engine && git diff --exit-code -- eval/engine-report.json eval/engine-report.md
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          RETELL_API_KEY: build-dummy
          ANTHROPIC_API_KEY: build-dummy
          APP_URL: http://localhost:3000
          JUDGE_PROVIDER: claude
  # The pasted Retell key, followed through a real `next dev` (scripts/canary-live.ts). A separate job, so it runs
  # beside the checks above. About 25 seconds a run.
  canary-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: The key is nowhere in a real run
        run: npm run canary:live
      - name: The search finds a deliberate leak
        run: |
          set +e
          CANARY_INJECT_LEAK=1 npm run canary:live
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 (leak found) from the injected run, got $code"
            exit 1
          fi
